# Bio-LLM 运行参数
# 复制此文件为 config.yaml 并修改
# cp config/config.example.yaml config/config.yaml

# 金标准 PMID 数量 (默认 48 = 全量，设小值用于快速测试)
sample_size: 48

# 随机种子 (可选，不设置则每次随机)
# seed: 42

# NCBI Entrez 邮箱 (必填)
email: "your_email@example.com"

# 阿里云百炼 Qwen 模型名称
# qwen3.7-max: 滚动版本，高 RPM (30000)，适合大批量
# qwen3.7-max-2026-05-20: 日期版本，低 RPM (600)，固定模型版本
model: "qwen3.7-max"

# LLM 温度 (0 = 确定性输出)
temperature: 0

# LLM 输出确定性种子 (可选，设置后模型输出可复现)
seed: 42

# 并行 worker 数量
workers: 4

# NCBI 代理旁路 (true 时绕过 http_proxy 直连 PubMed)
ncbi_bypass_proxy: false

# NCBI 直连域名列表 (逗号分隔)
ncbi_no_proxy_hosts: "eutils.ncbi.nlm.nih.gov,ncbi.nlm.nih.gov,pubmed.ncbi.nlm.nih.gov"

# 金标准文本来源: fitz / hybrid / nougat
text_source: "fitz"
