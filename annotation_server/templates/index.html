<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>人工标注服务器</title>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;margin:20px}
      label{display:block;margin-top:8px}
      input,select,textarea{width:400px;padding:6px}
      .small{width:200px}
      .candidate{border:1px solid #ddd;padding:8px;margin:6px 0;border-radius:6px;display:flex;align-items:center;justify-content:space-between}
      .candidate .meta{color:#666;font-size:12px}
      .candidate button{margin-left:12px}
      .candidate.selected{background:#e8f4ff;border-color:#2b8cff}
      .candidate.hidden{display:none}

      /* Assay chips */
      #assays{gap:8px}
      .assay-chip{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid #ddd;border-radius:16px;margin:4px;cursor:pointer;user-select:none;background:#fafafa}
      .assay-chip input{margin-right:8px}
      .assay-chip.checked{background:#2b8cff;color:#fff;border-color:#2b8cff}
      .assay-chip.checked input{outline:2px solid rgba(255,255,255,0.15)}
    </style>
  </head>
  <body>
    <div style="margin-bottom:12px;padding:8px 0;border-bottom:1px solid #eee">
      <a href="/">Home</a> |
      <a href="/ai">AI 审核</a> |
      <a href="/api/export_csv">导出 CSV</a>
    </div>
    <h2>人工标注表单</h2>
    <form id="annoForm" onsubmit="return false;">
      <label>PubMed ID
        <input name="pubmed_id" id="pubmed_id" />
      </label>

      <label>TF（可以输入别名，搜索并选择）
        <input id="tf_q" class="small" />
        <button type="button" onclick="searchTF()">搜索TF</button>
      </label>
      <div id="tf_candidates"></div>

      <label>基因（输入后搜索ENSG）
        <input id="gene_q" class="small" />
        <button type="button" onclick="searchGene()">搜索Gene</button>
      </label>
      <div id="gene_candidates"></div>

      <label>Cell line
        <input id="cellline" />
      </label>

      <label>Assay（多选）
        <div id="assays" style="display:block;max-width:860px;">
          {% for cat in assay_categories %}
            <div style="margin-top:8px;margin-bottom:6px;font-weight:600;">{{ cat }}</div>
            <div style="display:flex;flex-wrap:wrap;">
              {% for a in grouped_assays[cat] %}
                <label class="assay-chip" title="{{ a.en }}">
                  <input type="checkbox" name="assay" value="{{ a.tag }}"> <span>{{ a.cn }} ({{ a.tag }})</span>
                </label>
              {% endfor %}
            </div>
          {% endfor %}
        </div>
      </label>

      <label>潜在复合体
        <input id="complex" />
      </label>

      <div style="margin-top:12px">
        <button type="button" onclick="save()">保存</button>
        <button type="button" onclick="loadList()">查看最新条目</button>
      </div>
    </form>

    <h3>最新保存</h3>
    <div id="list"></div>

    <script src="/static/app.js"></script>
  </body>
</html>
